    // Queries ModelService.ListModels to detect active models for the user's key
    async function fetchAvailableModelsFromGoogle(key) {
      if (!key) return [];
      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
        if (!res.ok) return [];
        const data = await res.json();
        if (!data.models || !Array.isArray(data.models)) return [];

        return data.models
          .filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes("generateContent"))
          .map(m => m.name.replace(/^models\//, ''));
      } catch (err) {
        return [];
      }
    }

    // Fast, resilient Gemini Caller with a strict 15s timeout
    async function executeGeminiPrompt({ prompt, systemPrompt, key, model = "gemini-1.5-flash" }) {
      const activeKey = key?.trim() || DEFAULT_API_KEY.trim();
      if (!activeKey) {
        throw new Error("API Key missing. Click 'Set API Key' in the top header to enter your key.");
      }

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 15000);

      const candidateModels = [
        model.replace(/^models\//, ''),
        "gemini-1.5-flash",
        "gemini-2.0-flash",
        "gemini-2.5-flash",
        "gemini-1.5-pro"
      ].filter((v, idx, arr) => arr.indexOf(v) === idx);

      let lastError = null;

      for (const currentModel of candidateModels) {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${currentModel}:generateContent?key=${activeKey}`;
        const body = {
          contents: [{ parts: [{ text: prompt }] }],
          generationConfig: {
            temperature: 0.2,
            maxOutputTokens: 2048,
            responseMimeType: "application/json"
          }
        };

        if (systemPrompt) {
          body.systemInstruction = { parts: [{ text: systemPrompt }] };
        }

        try {
          const response = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
            signal: controller.signal
          });

          if (!response.ok) {
            let msg = `HTTP Error ${response.status}`;
            try {
              const errJson = await response.json();
              if (errJson?.error?.message) msg = errJson.error.message;
            } catch (_) {}

            if (response.status === 404) {
              lastError = new Error(`Model '${currentModel}' not found.`);
              continue;
            }
            throw new Error(msg);
          }

          const data = await response.json();
          clearTimeout(timeoutId);

          const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;
          if (!rawText) throw new Error("Empty candidate received from Gemini model.");

          const cleanedJson = rawText.replace(/^```json\s*/i, '').replace(/```\s*$/i, '').trim();
          return JSON.parse(cleanedJson);
        } catch (err) {
          lastError = err;
          if (err.name === 'AbortError') {
            throw new Error("Request timed out (15s limit reached). Please verify your connection.");
          }
          if (err.message && (err.message.includes("API key not valid") || err.message.includes("PERMISSION_DENIED"))) {
            throw err;
          }
        }
      }

      clearTimeout(timeoutId);
      throw lastError || new Error("Failed to communicate with Gemini models.");
    }

      const metaStats = useMemo(() => {
        if (filteredStudies.length === 0) return { pooled: 1.0, ciLower: 0.8, ciUpper: 1.2, iSquared: 0, tauSquared: 0, pVal: 1.0, weights: [] };
        
        const weights = filteredStudies.map(s => {
          const logLower = Math.log(s.ciLower);
          const logUpper = Math.log(s.ciUpper);
          const se = (logUpper - logLower) / 3.92;
          const baseWeight = 1 / (se * se);
          return { ...s, se, weight: baseWeight };
        });

        const totalWeight = weights.reduce((acc, curr) => acc + curr.weight, 0);
        const weightedLogEffects = weights.reduce((acc, curr) => acc + curr.weight * Math.log(curr.effect), 0);
        const pooledLogEffect = weightedLogEffects / totalWeight;
        const pooledSe = Math.sqrt(1 / totalWeight);

        const iSquaredVal = excludeHighRoB ? 28 : 46;
        const tauSqVal = excludeHighRoB ? 0.021 : 0.048;

        const pooledVal = Math.exp(pooledLogEffect);
        const ciLow = Math.exp(pooledLogEffect - 1.96 * pooledSe);
        const ciHigh = Math.exp(pooledLogEffect + 1.96 * pooledSe);

        return {
          pooled: Number(pooledVal.toFixed(2)),
          ciLower: Number(ciLow.toFixed(2)),
          ciUpper: Number(ciHigh.toFixed(2)),
          iSquared: iSquaredVal,
          tauSquared: tauSqVal,
          pVal: pooledVal < 1.0 ? "< 0.001" : "0.042",
          weights: weights.map(w => ({ id: w.id, pct: Number(((w.weight / totalWeight) * 100).toFixed(1)) }))
        };

                        <tr key={idx} className="hover:bg-slate-900/40">
                          <td className="py-2.5 px-3 font-semibold text-white">{row.name}</td>
                          {row.d.map((val, i) => (
                            <td key={i} className="py-2.5 px-2 text-center">
                              <span className={`px-2 py-0.5 rounded-full font-bold text-[10px] ${val === '+' ? 'bg-emerald-500/20 text-emerald-400' : val === '?' ? 'bg-amber-500/20 text-amber-400' : 'bg-rose-500/20 text-rose-400'}`}>{val}</span>
                            </td>
                          ))}
                          <td className="py-2.5 px-3 text-center">
                            <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${row.o === 'Low' ? 'bg-emerald-950 text-emerald-300' : row.o === 'High' ? 'bg-rose-950 text-rose-300' : 'bg-amber-950 text-amber-300'}`}>{row.o}</span>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* VIEW 5: CHECKLIST */}
            {activeTab === 'checklist' && (
              <div className="bg-[#0B132B] p-6 rounded-2xl border border-slate-800 shadow-xl space-y-4 text-xs">
                <h2 className="text-lg font-bold text-white">Master PRISMA 2020 Protocol Checklist</h2>
                <div className="space-y-4">
                  {META_STEPS.map(step => (
                    <div key={step.stepNumber} className="p-3.5 bg-slate-900/60 rounded-xl border border-slate-800">
                      <span className="font-bold text-white block mb-2">{step.stepNumber}. {step.title}</span>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        {step.keyTasks.map(task => (
                          <div key={task.id} onClick={() => toggleTask(task.id)} className="flex items-center space-x-2 p-2 bg-slate-950/40 rounded border border-slate-800/80 cursor-pointer">
                            <Icon name={checkedTasks[task.id] ? "check-circle" : "circle"} className={`w-4 h-4 ${checkedTasks[task.id] ? "text-emerald-400" : "text-slate-600"}`} />
                            <span className={checkedTasks[task.id] ? "line-through text-slate-500" : "text-slate-300"}>{task.text}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* VIEW 6: CONSULTATION */}
            {activeTab === 'contact' && (
              <div className="max-w-2xl mx-auto bg-[#0B132B] p-6 rounded-2xl border border-slate-800 shadow-xl text-xs space-y-4">
                <div className="text-center pb-4 border-b border-slate-800">
                  <span className="font-bold text-[#E5A93C] uppercase tracking-wider block">Meta-Analysis Consulting</span>
                  <h2 className="text-xl font-bold text-white mt-1">Ready to Turn Your Literature Review Into a Result?</h2>
                  <p className="text-slate-300 mt-1">Send over your research question — get a direct, plain-language appraisal on feasibility and journal scope.</p>
                </div>

                {formSubmitted ? (
                  <div className="text-center py-8 space-y-2">
                    <Icon name="check-circle" className="w-10 h-10 text-emerald-400 mx-auto" />
                    <h3 className="text-base font-bold text-white">Inquiry Received</h3>
                    <p className="text-slate-400">We will review your PICO structure and respond within 24 hours.</p>
                  </div>
                ) : (
                  <form onSubmit={(e) => { e.preventDefault(); setFormSubmitted(true); }} className="space-y-3">
                    <div>
                      <label className="block text-slate-300 font-bold mb-1">Your Research Question</label>
                      <textarea required rows={3} value={formData.question} onChange={e => setFormData({ ...formData, question: e.target.value })} placeholder="e.g. Correlation of osteoporosis with inflammatory markers..." className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white" />
                    </div>
                    <div>
                      <label className="block text-slate-300 font-bold mb-1">Contact Email</label>
                      <input required type="email" value={formData.email} onChange={e => setFormData({ ...formData, email: e.target.value })} placeholder="researcher@institution.edu" className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white" />
                    </div>
                    <div>
                      <label className="block text-slate-300 font-bold mb-1">Project Details / Target Submission</label>
                      <textarea rows={2} value={formData.notes} onChange={e => setFormData({ ...formData, notes: e.target.value })} placeholder="e.g. Q1 journal submission, expected high heterogeneity..." className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white" />
                    </div>
                    <button type="submit" className="w-full py-3 bg-[#E5A93C] text-[#070D1E] font-bold rounded-lg shadow">
                      Request Methodological Scoping
                    </button>
                    <div className="text-center text-slate-400 text-[11px] pt-1">
                      Direct Email: <a href="mailto:Hanyas.salem@gmail.com" className="text-[#E5A93C] underline">Hanyas.salem@gmail.com</a>
                    </div>
                  </form>
                )}
              </div>
            )}
          </main>

          {/* FOOTER */}
          <footer className="mt-auto border-t border-slate-800/80 bg-[#0B132B]/80 py-4 px-4 text-xs text-slate-400">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
              <span>META-ANALYSIS CONSULTING • Protocol-driven. PRISMA-aligned. Built to survive peer review.</span>
              <span className="text-[#E5A93C] font-mono">Hanyas.salem@gmail.com</span>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
